services:
  app:
    build:
      context: ./docker/php
    container_name: dbapp-app
    working_dir: /var/www/html
    volumes:
      - ./app:/var/www/html
      - /mnt/midas-bh:/mnt/midas-bh:ro
      - ./data/rechnungen:/mnt/rechnungen:rw
    environment:
      APP_ENV: local
    depends_on:
      - postgres
    networks:
      - dbapp
    ports:
      - "127.0.0.1:8080:8000"

  scheduler:
    image: dbapp-app:latest
    container_name: dbapp-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - ./app:/var/www/html
      - ./data/rechnungen:/mnt/rechnungen:rw
    environment:
      APP_ENV: local
    depends_on:
      - postgres
    networks:
      - dbapp

  samba:
    build:
      context: ./docker/samba
    container_name: dbapp-samba
    restart: unless-stopped
    volumes:
      - ./data/rechnungen:/share:rw
    ports:
      - "139:139"
      - "445:445"

  postgres:
    image: postgres:17
    container_name: dbapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dbapp
      POSTGRES_USER: dbapp
      POSTGRES_PASSWORD: CHANGE_ME_STRONG_PASSWORD
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dbapp

networks:
  dbapp:

volumes:
  postgres_data:
