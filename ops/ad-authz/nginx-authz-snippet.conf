# In the general SPNEGO-protected location:
auth_request /__authz_webapp;
auth_request_set $invoice_access $upstream_http_x_db_webapp_rechnungstool;
auth_request_set $admin_access $upstream_http_x_db_webapp_admin;
proxy_set_header X-Remote-User $remote_user;
proxy_set_header X-DB-Webapp-Rechnungstool $invoice_access;
proxy_set_header X-DB-Webapp-Admin $admin_access;

# The /fakturierung location uses the stricter subrequest:
# auth_request /__authz_invoice;
# auth_request_set $invoice_access $upstream_http_x_db_webapp_rechnungstool;
# auth_request_set $admin_access $upstream_http_x_db_webapp_admin;
# proxy_set_header X-Remote-User $remote_user;
# proxy_set_header X-DB-Webapp-Rechnungstool $invoice_access;
# proxy_set_header X-DB-Webapp-Admin $admin_access;

# The /admin location requires the additional administrator group:
# auth_request /__authz_admin;
# auth_request_set $admin_access $upstream_http_x_db_webapp_admin;
# proxy_set_header X-Remote-User $remote_user;
# proxy_set_header X-DB-Webapp-Admin $admin_access;

location = /__authz_webapp {
    internal;
    proxy_pass http://127.0.0.1:8090/check?group=DB-Webapp-Users;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Remote-User $remote_user;
}

location = /__authz_invoice {
    internal;
    proxy_pass http://127.0.0.1:8090/check?group=DB-Webapp-Users&group=DB-Webapp-Rechnungstool;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Remote-User $remote_user;
}

location = /__authz_admin {
    internal;
    proxy_pass http://127.0.0.1:8090/check?group=DB-Webapp-Users&group=DB-Webapp-Admins;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Remote-User $remote_user;
}
